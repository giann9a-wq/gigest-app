<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .g1 { fill: #f97316; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
    .g2 { fill: #000000; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
  </style>

  <!-- G arancione -->
  <text x="60" y="100" font-size="80" class="g1">G</text>

  <!-- G nera specchiata e riportata dentro -->
  <text x="-200" y="100" font-size="80" class="g2" transform="scale(-1,1)">G</text>
</svg>